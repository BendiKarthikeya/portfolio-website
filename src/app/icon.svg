<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#3f3f46" stroke-width="1.5"/>
  
  <!-- Inner Subtle Inset Ring -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  
  <!-- Minimalist Monogram KB in Crisp White/Silver -->
  <g>
    <!-- K -->
    <path d="M19 19 V45 M19 32 L31 19 M24 26.5 L33 45" 
          stroke="url(#silver)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Modern Minimalist Dot Accent -->
    <circle cx="48" cy="18" r="2.5" fill="#ffffff"/>
    
    <!-- B -->
    <path d="M37 19 H45 C48 19 50 21 50 24.5 C50 28 48 30 44.5 30 H37 V45 H45 C48.5 45 51 42.5 51 38.5 C51 34.5 48.5 32 44.5 32" 
          stroke="url(#silver)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
  </g>
</svg>
