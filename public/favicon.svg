<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Subtle inner border -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1"/>
  
  <!-- Monogram KB -->
  <g filter="url(#glow)">
    <!-- K -->
    <path d="M18 19 V45 M18 32 L30 19 M23 27 L32 45" 
          stroke="url(#gold)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Sparkle / Tech Accent Dot -->
    <circle cx="48" cy="18" r="2.5" fill="#FCD34D"/>
    
    <!-- B -->
    <path d="M37 19 H45 C48 19 50 21 50 24.5 C50 28 48 30 44.5 30 H37 V45 H45 C48.5 45 51 42.5 51 38.5 C51 34.5 48.5 32 44.5 32" 
          stroke="url(#gold)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
  </g>
</svg>
