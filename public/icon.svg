<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  
  <!-- Crisp KB Typography without any dots or artifacts -->
  <text x="32" y="43" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="27" 
        font-weight="800" 
        letter-spacing="0.5" 
        fill="#FFFFFF" 
        text-anchor="middle">KB</text>
</svg>
